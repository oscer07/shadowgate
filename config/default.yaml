# ShadowGate Default Configuration v1.1.0
# Override with environment variables prefixed SHADOWGATE_

proxy:
  host: "0.0.0.0"
  port: 8080
  auth:
    enabled: true
    users:
      - username: "admin"
        password: "changeme"
    api_keys:
      - "default-api-key-change-me"
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst_size: 10
  acl:
    whitelist: []
    blacklist: []
    blocked_domains: []
  upstream_proxy: null  # e.g. "http://upstream:8888" or "socks5://proxy:1080"
  timeout: 30
  max_connections: 100
  buffer_size: 65536

honeypot:
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8443
    server_header: "Apache/2.4.41 (Ubuntu)"
    fake_apps:
      - "/wp-login.php"
      - "/admin"
      - "/phpmyadmin"
      - "/administrator"
      - "/user/login"
      - "/.env"
      - "/api/v1/users"
  ssh:
    enabled: true
    host: "0.0.0.0"
    port: 2222
    server_version: "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5"
    fake_hostname: "prod-server-01"
    max_auth_attempts: 3
  ftp:
    enabled: true
    host: "0.0.0.0"
    port: 2121
    banner: "220 FTP Server Ready"
    max_login_attempts: 3
  smtp:
    enabled: true
    host: "0.0.0.0"
    port: 2525
    banner: "220 mail.example.com ESMTP Postfix"
    max_message_size: 10485760
  telnet:
    enabled: true
    host: "0.0.0.0"
    port: 2323
    banner: "BusyBox v1.30.1 (Ubuntu 20.04)"
    max_login_attempts: 3

dashboard:
  host: "127.0.0.1"
  port: 9090
  secret_key: "change-this-in-production"
  auth_enabled: false
  username: "admin"
  password: "shadowgate"
  refresh_interval: 5
  max_events: 1000

logging:
  level: "INFO"
  directory: "./logs"
  max_file_size: "50MB"
  max_files: 10
  format: "json"
  outputs:
    - "file"
    - "stdout"

alerts:
  enabled: false
  cooldown: 300
  slack:
    webhook_url: ""
    channel: "#security-alerts"
    message_template: null  # Custom Slack message template (JSON string)
  discord:
    webhook_url: ""
    message_template: null  # Custom Discord message template (JSON string)
  email:
    smtp_host: ""
    smtp_port: 587
    use_tls: true
    username: ""
    password: ""
    from_address: ""
    to_addresses: []
